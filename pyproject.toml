[project]
name = "linebothw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "google-cloud-firestore>=2.28.1",
    "google-genai>=2.18.1",
    "gunicorn>=23.0.0",
    "line-bot-sdk>=3.25.0",
    "llama-index>=0.14.24",
    "llama-index-embeddings-google-genai>=0.5.1",
    "llama-index-llms-google-genai>=0.10.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
